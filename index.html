<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6CB5">
<meta name="description" content="Corso da zero sui diagrammi di flusso con Flowgorithm: lezioni, laboratorio con tutor e simulatore.">
<title>Flowchart Lab · Diagrammi di flusso da zero</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='4' width='48' height='16' fill='%23FFFFC0' stroke='%23403F20' stroke-width='3'/%3E%3Cpath d='M32 14 58 32 32 50 6 32z' fill='%23FFC0C0' stroke='%23402020' stroke-width='3'/%3E%3Cpath d='M14 46h44l-6 14H8z' fill='%23C0E0FF' stroke='%23183060' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F3EE;--card:#FFFFFF;--ink:#1E2933;--muted:#5A6672;--line:#E3DFD6;
  --pri:#2D6CB5;--pri-ink:#fff;--pri-soft:#E7EFF9;
  --ok:#2E7D4F;--ok-soft:#E4F3EA;--ko:#B4501B;--ko-soft:#FCEEE4;--warn:#9A6A10;--warn-soft:#FBF3DF;
  --r:16px;--sh:0 1px 2px rgba(30,41,51,.06),0 4px 14px rgba(30,41,51,.07);
  --fs:17px;
  --t-f:#ECDDF8;--t-s:#5B3A82;--in-f:#CFE4FF;--in-s:#1D3E73;--out-f:#CDEFD2;--out-s:#1E5B2A;
  --as-f:#FFF6BE;--as-s:#5A4E12;--if-f:#FFD0D0;--if-s:#6B2323;--lp-f:#FFE1B5;--lp-s:#6A4210;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.hc{--bg:#fff;--card:#fff;--ink:#000;--muted:#1a1a1a;--line:#000;--pri:#003C96;--pri-soft:#DCE8FF;--ok:#005A1E;--ko:#8A2500}
body.hc .card,body.hc .btn{border:2px solid #000}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:3px solid #F5A623;outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--pri);color:#fff;padding:8px 12px;z-index:99}
.skip:focus{left:8px;top:8px}

/* barra in alto */
.top{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
body.hc .top{background:#fff}
.top .logo{width:30px;height:30px;flex:none}
.top h1{font-size:1rem;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:none;font-size:1.3rem;padding:4px 8px;border-radius:10px;cursor:pointer}
.limbtn{border:0;background:none;opacity:.32;cursor:pointer;padding:6px;border-radius:8px;line-height:0;transition:opacity .2s}
.limbtn:hover,.limbtn:focus-visible{opacity:.9}
body.lim .limbtn{opacity:.6}

main{max-width:760px;margin:0 auto;padding:16px 14px 110px}
body.lim main{max-width:1180px;padding-bottom:40px}

/* navigazione in basso */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;padding:4px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:48px;justify-content:center}
.nav a .i{font-size:1.35rem;line-height:1}
.nav a[aria-current="page"]{color:var(--pri);background:var(--pri-soft);font-weight:700}
body.lim .nav{position:static;max-width:1180px;margin:0 auto 20px;border:1px solid var(--line);border-radius:16px}

/* elementi base */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
h2{font-size:1.35rem;line-height:1.25;margin:4px 0 10px}
h3{font-size:1.08rem;margin:0 0 6px}
p{margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);transition:transform .12s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px}
.btn.icon{width:40px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:.8rem;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#4A90D9);border-radius:99px;transition:width .6s ease}
kbd,code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#F0EDE6;border-radius:6px;padding:1px 6px;font-size:.92em}
body.hc code{background:#eee}
mark{background:#FFF0A8;color:inherit;border-radius:4px;padding:0 3px}

/* home */
.hero{background:linear-gradient(135deg,#2D6CB5,#3F86C9 60%,#5AA0D6);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{color:#fff;font-size:1.5rem;margin:0 0 6px}
.hero p{opacity:.95}
.hero .bar{background:rgba(255,255,255,.3)}
.hero .bar>i{background:#fff}
.hero .float{position:absolute;right:-10px;top:-6px;width:120px;opacity:.25;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px) rotate(3deg)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);min-height:118px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .i{font-size:1.8rem}
.tile b{font-size:1.02rem}
.tile span{font-size:.84rem;color:var(--muted)}

/* liste */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);min-height:64px;border:0;width:100%;text-align:left;cursor:pointer}
.item .i{font-size:1.6rem;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--pri-soft);flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block}
.item .tx span{font-size:.85rem;color:var(--muted)}
.item .st{font-size:1.2rem}
.item.done .i{background:var(--ok-soft)}

/* slide */
.slidehead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--ok)}
.dots i.c{background:var(--pri);transform:scale(1.3)}
.slide{animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.slide .lead{font-size:1.08rem}
.rv>*{animation:rise .55s both;animation-delay:calc(var(--i,0)*120ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.act{border:2px dashed #C9D8EC;background:#F8FBFF;border-radius:18px;padding:14px;margin-top:14px}
body.hc .act{background:#fff;border-color:#000}
.act>.ah{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pri);margin-bottom:8px;font-size:.92rem;text-transform:uppercase;letter-spacing:.04em}
.slidenav{position:sticky;bottom:64px;display:flex;gap:10px;justify-content:space-between;margin-top:14px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
body.lim .slidenav{bottom:10px}
.slidenav .btn{flex:1}
.callout{border-left:4px solid var(--pri);background:var(--pri-soft);padding:10px 12px;border-radius:0 12px 12px 0;margin:10px 0}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.callout.warn{border-color:#D69E2E;background:var(--warn-soft)}

/* attività */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:50px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;transition:border-color .2s,background .2s,transform .1s}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.opt .mk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.9rem}
.opt[aria-pressed="true"] .mk{border-color:var(--pri);background:var(--pri);color:#fff}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;animation:rise .3s both}
.fb.ok{background:var(--ok-soft);color:#174A2E}
.fb.ko{background:var(--ko-soft);color:#6B2A07}
body.hc .fb{border:2px solid #000;color:#000}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.06)}}
.orderans{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.orderans .opt{min-height:44px}
.orderans .n{font-weight:800;color:var(--pri);width:22px}
.cls{display:flex;flex-direction:column;gap:10px}
.clsrow{background:var(--card);border-radius:14px;padding:10px;border:2px solid var(--line)}
.clsrow.right{border-color:var(--ok)}.clsrow.wrong{border-color:var(--ko)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{flex:1;min-width:84px;min-height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}

/* blocchi e diagrammi */
.chartwrap{overflow:auto;border-radius:14px;background:#FCFBF8;border:1px solid var(--line);max-height:62vh;-webkit-overflow-scrolling:touch;text-align:center;padding:6px}
.chartwrap.fit{max-height:none}
.chartwrap.fit svg{max-width:100%;height:auto}
body.lim .chartwrap{max-height:72vh}
svg.chart{display:inline-block;font-family:inherit}
svg .ln,svg .ar{stroke:#46505A;stroke-width:2;fill:none}
svg .ah{fill:#46505A}
svg .blk path,svg .blk rect,svg .blk polygon{stroke-width:2.2}
svg .k-term>*:first-child{fill:var(--t-f);stroke:var(--t-s)}
svg .k-in>*:first-child{fill:var(--in-f);stroke:var(--in-s)}
svg .k-out>*:first-child{fill:var(--out-f);stroke:var(--out-s)}
svg .k-asg>*:first-child,svg .k-dec>*:first-child{fill:var(--as-f);stroke:var(--as-s)}
svg .k-if>*:first-child{fill:var(--if-f);stroke:var(--if-s)}
svg .k-loop>*:first-child{fill:var(--lp-f);stroke:var(--lp-s)}
svg .k-ghost>*:first-child{fill:#fff;stroke:var(--pri);stroke-dasharray:6 5;animation:ghost 1.2s ease-in-out infinite}
@keyframes ghost{50%{stroke-dashoffset:11;fill:var(--pri-soft)}}
svg .bt{font-size:14px;fill:#1E2933;dominant-baseline:central;text-anchor:middle;pointer-events:none}
svg .io{font-size:10px;font-weight:800;fill:#1D3E73;pointer-events:none}
svg .lbl{font-size:12px;fill:#5A6672;font-weight:700}
svg .dl{stroke:#9AA4AE;stroke-width:1.2}
svg .blk.active>*:first-child{stroke:#F08C00;stroke-width:4;filter:drop-shadow(0 0 6px rgba(240,140,0,.75))}
svg .blk.err>*:first-child{stroke:#C0392B;stroke-width:4;filter:drop-shadow(0 0 6px rgba(192,57,43,.6))}
svg .blk.tap{cursor:pointer}
svg .blk.tap:hover>*:first-child{stroke-width:3.4}
svg .blk.newb{animation:popin .45s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
svg .blk.bugok>*:first-child{stroke:var(--ok);stroke-width:4}
svg .blk.bugno>*:first-child{stroke:var(--ko);stroke-width:4}
svg .ins{cursor:pointer}
svg .ins circle{fill:#fff;stroke:var(--pri);stroke-width:2}
svg .ins text{fill:var(--pri);font-size:17px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .ins:hover circle,svg .ins:focus circle{fill:var(--pri-soft)}
svg.draw .blk{animation:popin .5s both}
.mini{display:block;max-width:100%;height:auto}

/* esecutore */
.runner .rbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.runner .speed{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.runner .speed input{width:90px}
.runner .zoom{margin-left:auto;display:flex;gap:6px}
.rpanel{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:10px}
@media (max-width:560px){.rpanel{grid-template-columns:1fr}}
.ph{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted);margin-bottom:6px}
.vars,.console{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:84px}
.vlist{display:flex;flex-wrap:wrap;gap:8px}
.var{display:flex;flex-direction:column;border:2px solid #D7C97A;background:var(--as-f);border-radius:10px;padding:4px 10px;min-width:64px;transition:transform .2s}
.var small{font-size:.68rem;color:var(--muted)}
.var b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.02rem}
.var.flash{animation:vflash .7s}
@keyframes vflash{30%{transform:scale(1.15);background:#FFE066}}
.console{background:#182028;color:#E6EDF3;border-color:#182028}
.console .ph{color:#9FB0C0}
.clines{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.cl{animation:rise .25s both;word-break:break-word}
.cl.out{color:#9BE7A9}
.cl.in{color:#9CCBFF}
.cl.err{color:#FFB38A;background:rgba(255,120,60,.12);padding:6px 8px;border-radius:8px;font-family:system-ui,sans-serif}
.cl.inf{color:#C9D3DC;font-family:system-ui,sans-serif;font-size:.82rem;opacity:.85}
.cl.cond{color:#F7C873;font-size:.82rem}
.cl.end{color:#fff;font-weight:700}
.cin{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cin label{width:100%;font-size:.85rem;color:#9CCBFF}
.cin input{flex:1;min-width:110px;min-height:44px;border-radius:10px;border:2px solid #4A90D9;padding:6px 10px;background:#0F151B;color:#fff}
.cin .cerr{width:100%;color:#FFB38A;font-size:.85rem}

/* tutor */
.exhead{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.exhead span{flex:none;font-size:.75rem;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--muted);font-weight:700}
.exhead span.c{background:var(--pri);color:#fff}
.exhead span.d{background:var(--ok-soft);color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-start;animation:rise .35s both}
.msg .av{width:34px;height:34px;border-radius:50%;background:var(--pri-soft);display:grid;place-items:center;flex:none;font-size:1.15rem}
.msg .bub{background:var(--card);border-radius:4px 16px 16px 16px;padding:10px 12px;box-shadow:var(--sh);max-width:100%}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--pri);color:#fff;border-radius:16px 4px 16px 16px}
.msg.good .bub{background:var(--ok-soft)}
.msg.bad .bub{background:var(--ko-soft)}
body.hc .msg .bub{border:2px solid #000;color:#000;background:#fff}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:typ 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typ{30%{transform:translateY(-5px);opacity:.5}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bopt{display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;min-height:56px;transition:border-color .2s,transform .1s}
.bopt:active{transform:scale(.98)}
.bopt.hint{border-color:#F5A623;animation:pop .9s 2}
.bopt.no{opacity:.4;border-color:var(--ko)}
.tutorbox{position:relative}
.stickychart{position:sticky;top:60px;z-index:5}
body.lim .exgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}

/* giochi */
.river{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px;align-items:stretch;background:#EAF3E3;border-radius:16px;padding:8px;min-height:230px}
.bank{display:flex;flex-direction:column;gap:6px;justify-content:center;background:#CFE6BE;border-radius:12px;padding:6px}
.bank .lab,.water .lab{font-size:.7rem;text-align:center;color:#3B5A2A;font-weight:700}
.water{background:linear-gradient(180deg,#9FD0EE,#6BB3E0);border-radius:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:6px}
.water::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,255,255,.18) 18px 22px);animation:waves 4s linear infinite}
@keyframes waves{to{background-position:60px 0}}
.boatlane{position:relative;height:110px}
.boat{position:absolute;top:0;left:0;width:56%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#8B5A2B;border-radius:12px 12px 40px 40px;color:#fff;transition:left .9s cubic-bezier(.5,0,.3,1);gap:2px;box-shadow:0 4px 0 #5E3B1B}
.boat.right{left:44%}
.ani{font-size:1.9rem;line-height:1;border:0;background:#fff;border-radius:12px;min-height:52px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .15s}
.ani small{font-size:.62rem;font-weight:700;color:#334}
.ani[disabled]{opacity:.55;cursor:default}
.boat .ani{background:#F2D7B6;min-height:44px;padding:0 8px}
.moves{margin:8px 0 0;padding-left:22px}
.moves li{animation:rise .3s both}
.jugs{display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:16px 4px 6px;background:#EAF3FA;border-radius:16px}
.jug{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:4px;border-radius:14px}
.jug .glass{position:relative;width:78px;border:3px solid #35607F;border-top:0;border-radius:0 0 14px 14px;background:rgba(255,255,255,.7);overflow:hidden}
.jug .w{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#5BB0E8,#2F7FBF);transition:height .8s cubic-bezier(.4,0,.2,1)}
.jug .w::after{content:"";position:absolute;left:0;right:0;top:-3px;height:6px;background:rgba(255,255,255,.5);border-radius:50%}
.jug .num{position:relative;z-index:1;font-weight:800;font-size:1.1rem;display:grid;place-items:center;height:100%;color:#0D2C45;text-shadow:0 0 4px #fff}
.jug.sel{background:#FFF3C4;outline:3px solid #F5A623}
.jug b{font-size:.85rem}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.tbl th{background:var(--pri-soft)}

/* giocattoli delle lezioni */

.vbox .fly{position:absolute;left:50%;top:-64px;transform:translateX(-50%);background:var(--pri);color:#fff;border-radius:10px;padding:2px 10px;font-size:1.2rem;animation:fly .8s cubic-bezier(.5,0,.5,1) forwards}
@keyframes fly{to{top:18px;opacity:0}}
.vbox .old{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:1.2rem;color:var(--ko);animation:out .8s forwards}
@keyframes out{to{top:-40px;opacity:0;transform:translateX(30px) rotate(25deg)}}
.prog{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.prog button{font-family:ui-monospace,Menlo,monospace;font-size:1rem}

.machine{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;font-weight:700;flex-wrap:wrap}
.machine .mb{background:#4A5866;color:#fff;border-radius:14px;padding:16px 14px;font-size:1.6rem;position:relative}
.machine .mb span{display:inline-block;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.machine .data{background:var(--in-f);border:2px solid var(--in-s);border-radius:10px;padding:6px 10px;animation:slideR 2.4s ease-in-out infinite}
.machine .data.o{background:var(--out-f);border-color:var(--out-s);animation-delay:1.2s}
@keyframes slideR{0%{transform:translateX(-10px);opacity:.3}50%{transform:none;opacity:1}100%{transform:translateX(10px);opacity:.3}}
.phases{display:flex;flex-direction:column;gap:0;align-items:center}
.phase{background:var(--card);border:2px solid var(--pri);border-radius:14px;padding:8px 14px;width:100%;max-width:440px;animation:rise .5s both;animation-delay:calc(var(--i)*350ms)}
.phase b{color:var(--pri)}
.parrow{height:22px;width:2px;background:var(--pri);position:relative;animation:rise .3s both;animation-delay:calc(var(--i)*350ms + 150ms)}
.parrow::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top-color:var(--pri)}
.race{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.lane{display:flex;align-items:center;gap:8px}
.lane .tr{flex:1;height:34px;background:#EEE9DF;border-radius:10px;position:relative;overflow:hidden}
.lane .rn{position:absolute;left:0;top:0;height:100%;width:34px;display:grid;place-items:center;font-size:1.4rem}
.lane.go .rn{animation:run var(--d) linear forwards}

.toy .path.on{stroke:#F08C00;stroke-width:6}

.toy .nd.on{filter:drop-shadow(0 0 6px rgba(240,140,0,.9))}
.counter{font-size:2.6rem;font-weight:800;color:var(--pri);font-family:ui-monospace,Menlo,monospace}

@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}

.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;min-height:90px;text-align:center}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1E2933;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;animation:rise .3s both;max-width:90vw;text-align:center}

 .codebox{grid-template-columns:1fr;gap:4px}.codebox span{margin:0 0 8px 4px}.buildg .chartwrap{max-height:36vh}}

<script>
"use strict";
/* ================= UTILITÀ ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _uid=0;const uid=()=>'n'+(++_uid)+Math.random().toString(36).slice(2,6);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem('fcl_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fcl_'+k,JSON.stringify(v))}catch(e){}}};
const SET=Object.assign({notation:'=',fs:2,hc:false,rm:false,lim:false},store.get('set',{}));
if(!SET.v2){SET.v2=1;SET.notation='='}

/* ================= MOTORE: ESPRESSIONI ================= */
class FErr extends Error{constructor(m,node){super(m);this.node=node}}
function tokenize(s){
  const t=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
      let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      const raw=s.slice(i,j);if((raw.match(/\./g)||[]).length>1)throw new FErr(`Il numero "${raw}" ha troppi punti.`);
      t.push({k:'num',v:parseFloat(raw),raw});i=j;continue}
    if(c==='"'||c==="'"||c==='“'||c==='”'){const close=c==='“'?'”':c;let j=i+1;while(j<s.length&&s[j]!==close&&!(close==='"'&&s[j]==='”'))j++;
      if(j>=s.length)throw new FErr('Hai aperto le virgolette ma non le hai chiuse.');t.push({k:'str',v:s.slice(i+1,j)});i=j+1;continue}
    if(/[A-Za-zÀ-ÿ_]/.test(c)){let j=i;while(j<s.length&&/[A-Za-zÀ-ÿ0-9_]/.test(s[j]))j++;t.push({k:'id',v:s.slice(i,j)});i=j;continue}
    const two=s.substr(i,2);
    if(['==','!=','<>','<=','>=','&&','||'].includes(two)){t.push({k:'op',v:two});i+=2;continue}
    const map={'≤':'<=','≥':'>=','≠':'!=','×':'*','÷':'/','−':'-',':':'/'};
    if(c==='←')throw new FErr('La freccia ← si usa solo nel blocco di assegnazione, non dentro un calcolo.');
    if(c in map){t.push({k:'op',v:map[c]});i++;continue}
    if('+-*/%^&()<>=!,'.includes(c)){t.push({k:'op',v:c});i++;continue}
    throw new FErr(`Non conosco il simbolo "${c}".`)}
  return t}
function parse(src){
  if(src==null||String(src).trim()==='')throw new FErr('Il campo è vuoto: scrivi qualcosa.');
  const t=tokenize(String(src));let p=0;
  const isOp=v=>t[p]&&t[p].k==='op'&&t[p].v===v, isKw=v=>t[p]&&t[p].k==='id'&&t[p].v.toLowerCase()===v;
  const expr=()=>or();
  function or(){let a=and();while(isOp('||')||isKw('or')){p++;a={k:'bin',op:'or',a,b:and()}}return a}
  function and(){let a=not();while(isOp('&&')||isKw('and')){p++;a={k:'bin',op:'and',a,b:not()}}return a}
  function not(){if(isOp('!')||isKw('not')){p++;return{k:'un',op:'not',a:not()}}return cmp()}
  function cmp(){let a=add();const ops=['=','==','!=','<>','<','>','<=','>='];
    while(t[p]&&t[p].k==='op'&&ops.includes(t[p].v)){let op=t[p++].v;if(op==='==')op='=';if(op==='<>')op='!=';a={k:'bin',op,a,b:add()}}return a}
  function add(){let a=mul();while(isOp('+')||isOp('-')||isOp('&')){const op=t[p++].v;a={k:'bin',op,a,b:mul()}}return a}
  function mul(){let a=un();while(isOp('*')||isOp('/')||isOp('%')||isKw('mod')){const op=t[p].k==='id'?'%':t[p].v;p++;a={k:'bin',op,a,b:un()}}return a}
  function un(){if(isOp('-')){p++;return{k:'un',op:'-',a:un()}}if(isOp('+')){p++;return un()}return pw()}
  function pw(){const a=prim();if(isOp('^')){p++;return{k:'bin',op:'^',a,b:un()}}return a}
  function prim(){const x=t[p];
    if(!x)throw new FErr('Il calcolo è incompleto: manca qualcosa alla fine.');
    if(x.k==='num'){p++;return{k:'num',v:x.v}}
    if(x.k==='str'){p++;return{k:'str',v:x.v}}
    if(x.k==='op'&&x.v==='('){p++;const e=expr();if(!isOp(')'))throw new FErr('Manca una parentesi chiusa ")".');p++;return e}
    if(x.k==='id'){p++;const low=x.v.toLowerCase();
      if(low==='true'||low==='vero')return{k:'bool',v:true};
      if(low==='false'||low==='falso')return{k:'bool',v:false};
      if(['and','or','not','mod'].includes(low))throw new FErr(`"${x.v}" è una parola speciale: qui serve un valore.`);

function pseudo(seq,ind=0){let s='';const p='   '.repeat(ind);
  for(const n of seq){
    if(n.t==='if')s+=`${p}Se ${n.c} allora\n${pseudo(n.yes,ind+1)}${n.no.length?p+'Altrimenti\n'+pseudo(n.no,ind+1):''}${p}Fine se\n`;
    else if(n.t==='while')s+=`${p}Mentre ${n.c} ripeti\n${pseudo(n.body,ind+1)}${p}Fine ciclo\n`;
    else if(n.t==='for')s+=`${p}Per ${blockLabel(n)} ripeti\n${pseudo(n.body,ind+1)}${p}Fine ciclo\n`;
    else s+=p+blockLabel(n)+'\n'}
  return s}

{id:4,icon:'🔶',title:'Il rombo: fare una scelta',sub:'Condizioni, Vero e Falso',min:12,ex:['e6','e7','e8','e9','e10'],slides:[
 {t:'Fare una scelta',h:`<p class="lead">Ogni giorno scegli: <b>se</b> piove prendo l’ombrello, <b>altrimenti</b> no.</p>
  <p>Anche un algoritmo a volte deve scegliere che strada prendere. Per farlo c’è il <b>rombo</b>.</p>
  <p>Prova le due strade:</p>`,
  act:{type:'branch',skill:'selezione'}},
 {t:'Il rombo',h:`<div class="toy">__SHAPE_if__</div>
  <p class="lead">Dentro il rombo c’è una <b>domanda</b> che ha solo due risposte: <b>Vero</b> o <b>Falso</b>.</p>
  <p>Il rombo ha <b>un ingresso e due uscite</b>. Poi le due strade si riuniscono.</p>`,
  act:{type:'quiz',q:'Quante uscite ha il rombo?',opts:[['Due: Vero e Falso',1,'Esatto.'],['Una',0,'Una sola uscita ce l’hanno gli altri blocchi. Il rombo ne ha due.'],['Tre',0,'Solo due: Vero e Falso.']]}},
 {t:'Le condizioni',h:`<p>La domanda nel rombo si chiama <b>condizione</b>. Di solito è un confronto:</p>
  <table class="tbl"><tr><th>Simbolo</th><th>Significa</th></tr><tr><td><code>&gt;</code></td><td>maggiore</td></tr><tr><td><code>&lt;</code></td><td>minore</td></tr><tr><td><code>&gt;=</code></td><td>maggiore o uguale</td></tr><tr><td><code>&lt;=</code></td><td>minore o uguale</td></tr><tr><td><code>=</code> oppure <code>==</code></td><td>uguale</td></tr><tr><td><code>!=</code> oppure <code>&lt;&gt;</code></td><td>diverso</td></tr></table>
  <p class="small muted">Nel rombo il simbolo = fa una domanda: “sono uguali?”.</p>`,
  act:{type:'tf',q:'a vale 5 e b vale 3. Vero o falso?',items:[['a > b',true,'5 è maggiore di 3: Vero.'],['a = b',false,'5 non è uguale a 3: Falso.'],['a != b',true,'5 è diverso da 3: Vero.'],['b >= 3',true,'3 è uguale a 3, quindi “maggiore o uguale” è Vero.']]}},
 {t:'Due condizioni insieme',h:`<ul class="big"><li><code>and</code> (e): Vero solo se sono vere <b>tutte e due</b></li><li><code>or</code> (o): Vero se ne è vera <b>almeno una</b></li></ul>
  <div class="callout">Esempio: entro al cinema se ho il biglietto <b>and</b> il film non è ancora iniziato.</div>`,
  act:{type:'quiz',q:'a vale 4 e b vale -2. La condizione  a > 0 and b > 0  è…',opts:[['Falsa',1,'Giusto: a > 0 è vera, ma b > 0 è falsa. Con and devono essere vere tutte e due.'],['Vera',0,'Con and devono essere vere tutte e due, e b > 0 è falsa.']],skill:'selezione'}},
 {t:'Guarda la strada che si illumina',h:`<p>Un alunno è <b>ammesso</b> se la media è almeno 6.</p>
  <p>Esegui il programma <b>due volte</b>: prima con 7, poi con 5.</p>`,
  act:{type:'run',prog:'media',times:2,skill:'simulatore'}},
 {t:'Costruisci: maggiorenne o minorenne?',h:`<p><b>Problema:</b> chiedi l’età e scrivi “Maggiorenne” se ha almeno 18 anni, altrimenti “Minorenne”.</p>`,
  act:{type:'build',b:'eta',skill:'selezione'}},
 {t:'Leggi bene le parole',h:`<div class="codebox"><span>“<b>supera</b> 100”</span><code>&gt; 100</code><span>“<b>almeno</b> 18”</span><code>&gt;= 18</code><span>“<b>tutti e due</b>”</span><code>and</code><span>“<b>uno dei due</b>”</span><code>or</code></div>`,
  act:{type:'quiz',q:'“Lo sconto si fa se il prezzo supera 100 euro.” Quale condizione scrivi?',opts:[['prezzo > 100',1,'Esatto: “supera” vuol dire più di 100. Con 100 esatti niente sconto.'],['prezzo >= 100',0,'Così anche 100 esatti avrebbe lo sconto. “Supera” vuol dire >.'],['prezzo < 100',0,'Così lo sconto andrebbe a chi spende poco.']],skill:'selezione'}},
 {t:'Rombi dentro rombi',h:`<p>A volte i casi sono <b>tre</b>. Per esempio una partita: vince la prima squadra, vince la seconda, oppure pareggio.</p>
  <p>Un rombo ha solo due uscite. Allora si mette un <b>secondo rombo</b> dentro una delle due strade.</p>`,
  act:{type:'quiz',q:'Con 3 casi possibili, quanti rombi servono?',opts:[['2',1,'Giusto: il primo divide in due, il secondo divide di nuovo una delle due strade.'],['3',0,'Ne bastano 2: se non è il primo caso e non è il secondo, è per forza il terzo.'],['1',0,'Un rombo ha solo due uscite: per tre casi non basta.']]}}
]},
{id:5,icon:'🔁',title:'Il ciclo: ripetere',sub:'Contatore e somma',min:12,ex:['e11','e12','e13'],slides:[
 {t:'Ripetere',h:`<p class="lead">Il <b>ciclo</b> (in inglese <i>loop</i>) ripete gli stessi blocchi più volte.</p>
  <p>Si ripete <b>finché</b> la condizione è vera. Quando diventa falsa, si esce.</p>
  <p>Il programma deve fare 5 flessioni. Premi il pulsante per fare un giro alla volta.</p>`,
  act:{type:'loop',skill:'ciclo'}},
 {t:'Il contatore',h:`<p>Per contare i giri si usa una variabile <b>contatore</b>, di solito <code>i</code>.</p>
  <div class="codebox"><code>i {=} 1</code><span>prima del ciclo: si parte da 1</span><code>i {=} i + 1</code><span>dentro il ciclo: aumenta di 1</span></div>`,
  act:{type:'quiz',q:'i vale 4. Il computer esegue  i {=} i + 1. Quanto vale ora i?',opts:[['5',1,'Giusto: 4 + 1 = 5.'],['4',0,'Il blocco cambia i: calcola 4 + 1 e lo rimette in i.'],['1',0,'Non diventa 1: si aggiunge 1 al valore di prima.']]}},
 {t:'Costruisci: conta da 1 a 5',h:`<p><b>Problema:</b> scrivi sullo schermo i numeri da 1 a 5.</p>
  <p>Il ciclo ha la forma di un <b>esagono</b> arancione.</p>`,
  act:{type:'build',b:'conta',skill:'ciclo'}},
 {t:'Guardalo girare',h:`<p>Questo programma conta da 1 a 20. Premi <b>▶ Esegui</b> e guarda il ciclo. Puoi aumentare la velocità con il coniglio 🐇.</p>`,
  act:{type:'run',prog:'conta',skill:'simulatore'}},
 {t:'La somma che cresce',h:`<p>Per sommare tanti numeri si usa una variabile che fa da <b>salvadanaio</b>.</p>
  <div class="codebox"><code>somma {=} 0</code><span>prima del ciclo: salvadanaio vuoto</span><code>somma {=} somma + n</code><span>dentro il ciclo: aggiungo n</span></div>`,
  act:{type:'quiz',q:'Perché si scrive somma {=} 0 prima del ciclo?',opts:[['Per partire con il salvadanaio vuoto',1,'Esatto: senza un valore di partenza il computer non può calcolare somma + n.'],['Non serve',0,'Serve: se la scatola è vuota, somma + n non si può calcolare.'],['Per far finire il ciclo',0,'A far finire il ciclo ci pensa il contatore.']]}},
 {t:'Il ciclo infinito',h:`<p>Se dimentichi <code>i {=} i + 1</code>, il contatore non cambia mai.</p>
  <p>La condizione resta sempre vera e il ciclo <b>non finisce più</b>.</p>
  <div class="callout warn">Si chiama <b>ciclo infinito</b>. È uno degli errori più comuni.</div>`,
  act:{type:'quiz',q:'i {=} 1, poi un ciclo con  i <= 10  che contiene solo  Output i. Cosa succede?',opts:[['Scrive 1 all’infinito',1,'Esatto: i resta 1, quindi i <= 10 è sempre vera. Manca i {=} i + 1.'],['Scrive da 1 a 10',0,'Lo farebbe se dentro ci fosse anche i {=} i + 1.'],['Non scrive niente',0,'1 <= 10 è vera, quindi entra nel ciclo e scrive.']],skill:'debug'}},
 {t:'Simula a mente',h:`<div class="codebox"><code>i {=} 1</code><code>finché i &lt;= 3:</code><code>&nbsp;&nbsp;Output i * 2</code><code>&nbsp;&nbsp;i {=} i + 1</code></div>`,
  act:{type:'quiz',q:'Cosa compare sullo schermo?',opts:[['2  4  6',1,'Giusto: i vale 1, 2, 3 e ogni volta si scrive il doppio. Con i = 4 si esce.'],['1  2  3',0,'Si scrive i * 2, non i.'],['2  4  6  8',0,'Quando i vale 4 la condizione è falsa: si esce prima di scrivere 8.']],skill:'ciclo'}}
]},
{id:6,icon:'🏅',title:'Ripasso finale',sub:'Controlla di sapere tutto',min:8,ex:['e14','e15'],slides:[
 {t:'Efficace o efficiente?',h:`<div class="grid2"><div class="callout ok"><b>Efficace</b> = funziona, il risultato è giusto.</div><div class="callout"><b>Efficiente</b> = funziona <b>e</b> ci mette poco.</div></div>
  <p>Premi <b>Via!</b>: tutti e due mettono in ordine gli stessi numeri.</p>
  <div class="race"><div class="lane" style="--d:4s"><span>🐢 A</span><div class="tr"><span class="rn">📦</span></div></div><div class="lane" style="--d:1s"><span>🐇 B</span><div class="tr"><span class="rn">📦</span></div></div></div>
  <button class="btn sm" data-race-go>🏁 Via!</button>`,
  act:{type:'quiz',q:'A ci mette 4 secondi, B 1 secondo. Il risultato è giusto per tutti e due.',opts:[['Tutti e due efficaci, B più efficiente',1,'Esatto.'],['Solo B è efficace',0,'Anche A arriva al risultato giusto: è efficace.'],['A è più efficiente',0,'Efficiente vuol dire più veloce, non più lento.']],skill:'fasi'}},
 {t:'Domanda 1',h:'',act:{type:'classify',q:'“Dato un prezzo, calcola il prezzo con l’IVA al 22%.”',bins:['Input','Output','Costante'],items:[['Il prezzo',0,'Lo scrive l’utente: input.'],['Il prezzo con IVA',1,'È il risultato: output.'],['22%',2,'Non cambia mai: costante.']],skill:'analisi'}},
 {t:'Domanda 2',h:'',act:{type:'classify',q:'Che forma ha ogni blocco?',bins:['Ovale','Parallelogramma','Rettangolo','Rombo'],items:[['Input',1,'Input e Output: parallelogramma.'],['Assegnazione',2,'Rettangolo.'],['Condizione',3,'Rombo.'],['Fine',0,'Ovale.']],skill:'blocchi'}},
 {t:'Domanda 3',h:`<div class="codebox"><code>a {=} 10</code><code>b {=} a - 4</code><code>a {=} b * 2</code></div>`,act:{type:'quiz',q:'Quanto valgono a e b alla fine?',opts:[['a = 12, b = 6',1,'Giusto: b = 10 - 4 = 6, poi a = 6 × 2 = 12.'],['a = 10, b = 6',0,'L’ultimo blocco cambia a.'],['a = 20, b = 6',0,'a prende b * 2, cioè 6 × 2.']],skill:'variabili'}},
 {t:'Domanda 4',h:'',act:{type:'quiz',q:'“Se il voto è almeno 6 scrivi Promosso, altrimenti Bocciato.” Cosa va nel rombo?',opts:[['voto >= 6',1,'Esatto.'],['voto > 6',0,'Con > il 6 sarebbe bocciato.'],['voto = 6',0,'Così sarebbe promosso solo chi prende 6.']],skill:'selezione'}},
 {t:'Domanda 5',h:'',act:{type:'order',q:'Metti in ordine i blocchi per sommare 5 numeri.',items:['somma {=} 0','i {=} 1','finché i <= 5','Input n','somma {=} somma + n','i {=} i + 1','Output somma'],ok:'Perfetto: prima si preparano le variabili, poi il ciclo, alla fine il risultato.',skill:'ciclo'}},
 {t:'Domanda 6',h:`<p>Per la media di due voti qualcuno ha scritto:</p><div class="codebox"><code>media {=} a + b / 2</code></div>`,act:{type:'quiz',q:'Con a = 6 e b = 8 cosa succede?',opts:[['Esce 10 invece di 7: mancano le parentesi',1,'Esatto: prima b / 2 = 4, poi 6 + 4 = 10. Serve (a + b) / 2.'],['Esce 7, è giusto',0,'Prima si fa la divisione: b / 2 = 4, poi a + 4.'],['Il programma si blocca',0,'Non si blocca: dà un risultato sbagliato.']],skill:'debug'}},
 {t:'Domanda 7',h:'',act:{type:'quiz',q:'Come fai a sapere se il tuo diagramma funziona?',opts:[['Lo provo con dati di cui conosco già il risultato',1,'Esatto. E prova anche i casi “strani”: lo zero, numeri uguali, numeri negativi.'],['Se mi sembra giusto va bene',0,'Sembrare giusto non basta: bisogna provarlo.'],['Lo provo una volta sola',0,'Una prova sola spesso non basta.']],skill:'simulatore'}}
]}];

const TYPEHINT={declare:'Si comincia sempre dichiarando le variabili.',input:'Ci serve un dato dall’utente: un parallelogramma di Input.',output:'È il momento di mostrare un risultato: un Output.',assign:'Bisogna calcolare o preparare un valore: un rettangolo di assegnazione.',if:'Qui c’è una decisione da prendere: un rombo.',while:'Qui bisogna ripetere qualcosa: un ciclo.',for:'Qui bisogna ripetere qualcosa: un ciclo.'};
const EXS=[
{id:'e1',n:1,mod:1,game:'river',title:'Il lupo, la capra e i cavoli',lvl:1,skills:['fasi'],text:'Un contadino deve portare sull’altra riva del fiume un lupo, una capra e un cesto di cavoli. La barca porta lui e <b>una sola cosa</b> alla volta. Se restano soli, il lupo mangia la capra e la capra mangia i cavoli. Come fa a portarli tutti dall’altra parte?'},
{id:'e2',n:2,mod:1,game:'jugs',title:'I travasi del contadino',lvl:1,skills:['analisi'],text:'Il contadino ha tre recipienti: uno da 25 litri con dentro 16 litri d’acqua, uno da 5 litri pieno e uno da 3 litri pieno. Versando l’acqua da un recipiente all’altro, deve avere <b>esattamente 20 litri</b> nel recipiente grande. Come fa?'},
{id:'e3',n:3,mod:3,title:'Area e perimetro del rettangolo',lvl:1,skills:['analisi','sequenza'],
 text:'Chiedi la <mark>base</mark> e l’<mark>altezza</mark> di un rettangolo. Calcola e scrivi l’<mark>area</mark> e il <mark>perimetro</mark>.',
 analysis:[
  {q:'Partiamo dall’analisi. Quali dati ci servono in <b>ingresso</b> (input)? Scegli tutti quelli giusti.',multi:1,opts:[['La base',1],['L’altezza',1],['L’area',0,'L’area non la conosciamo: è proprio quello che dobbiamo calcolare. È un dato di uscita.'],['Il colore del rettangolo',0,'Il colore non serve per fare i calcoli.']],ok:'Giusto: base e altezza sono i dati che conosciamo e che l’utente scrive.'},
  {q:'E in <b>uscita</b> (output), cosa dobbiamo mostrare?',multi:1,opts:[['L’area',1],['Il perimetro',1],['La base',0,'La base la conosciamo già: è un input.']],ok:'Esatto: area e perimetro sono i risultati.'},
  {q:'Ora la relazione. Come si calcola il <b>perimetro</b>? Chiamiamo b la base e h l’altezza.',opts:[['(b + h) * 2',1],['b * h',0,'Questa è l’area, non il perimetro.'],['b + h',0,'Così sommi solo due lati. Il rettangolo ne ha quattro!']],ok:'Perfetto: il perimetro è la somma di tutti i lati, cioè (b + h) × 2.'},
  {q:'E l’<b>area</b>?',opts:[['b * h',1],['(b + h) * 2',0,'Questo è il perimetro.'],['b * h / 2',0,'Diviso 2 si usa per il triangolo, non per il rettangolo.']],ok:'Sì: base per altezza.'},
  {q:'Brainstorming: per questo problema serve una scelta (rombo) o una ripetizione (ciclo)?',opts:[['No, basta una sequenza di blocchi uno dopo l’altro',1],['Serve un rombo',0,'Non c’è niente da decidere: i calcoli sono sempre gli stessi, qualunque sia il rettangolo.'],['Serve un ciclo',0,'Non dobbiamo ripetere niente: si calcola una volta sola.']],ok:'Esatto. Quando i passi sono sempre gli stessi si usa una <b>sequenza</b>.'}],
 sol:[D('b, h, perimetro, area','Reale','In Flowgorithm prima si dichiarano le variabili. Reale perché i lati possono avere la virgola.'),I('b','Leggiamo la base.'),I('h','Leggiamo l’altezza.'),A('perimetro','(b + h) * 2','Calcoliamo il perimetro e lo mettiamo nella scatola perimetro.'),O('perimetro','Mostriamo il perimetro.'),A('area','b * h','Ora l’area: base per altezza.'),O('area','E la mostriamo. Abbiamo finito i calcoli.')],
 wrong:[[D('b, h, perimetro, area','Stringa'),'Stringa vuol dire testo: con il testo non si fanno calcoli. Servono numeri, quindi Reale.'],[I('area'),'L’area non si chiede all’utente: la calcola il programma.'],[A('perimetro','b + h'),'Mancano due lati: il perimetro è (b + h) * 2.'],[A('area','(b + h) * 2'),'Questo è il perimetro, non l’area.'],[O('"area"'),'Con le virgolette il computer scrive la parola “area”, non il suo valore. Le virgolette vanno tolte.']],
 tests:[[[5,3],['16','15'],'base 5 e altezza 3'],[[2.5,4],['13','10'],'base 2.5 e altezza 4']],
 bug:{prog:[D('b, h, perimetro, area','Reale'),I('b'),I('h'),BAD(A('perimetro','b + h * 2')),O('perimetro'),A('area','b * h'),O('area')],q:'Un compagno ha scritto questo programma. Con base 5 e altezza 3 il perimetro gli viene 11 invece di 16. <b>Tocca il blocco sbagliato.</b>',why:'b + h * 2 fa prima h * 2 (la moltiplicazione ha la precedenza) e poi aggiunge b: 5 + 6 = 11. Servono le parentesi: (b + h) * 2.',hint:'Guarda i calcoli: ricordi chi si fa prima tra + e * ?'}},
{id:'e4',n:4,mod:3,title:'Il triangolo nel quadrato',lvl:2,skills:['analisi','sequenza'],
 text:'Chiedi il <mark>lato di un quadrato</mark>. Pensa a un triangolo che ha come <mark>base la diagonale</mark> del quadrato e come <mark>altezza il lato</mark>. Calcola e scrivi l’<mark>area del triangolo</mark>.',
 analysis:[
  {q:'Quali dati servono in <b>input</b>?',multi:1,opts:[['Il lato del quadrato',1],['La diagonale',0,'La diagonale non ce la danno: la calcoliamo noi partendo dal lato.'],['L’area del triangolo',0,'È il risultato da trovare: output.']],ok:'Giusto: basta il lato. Tutto il resto si calcola.'},
  {q:'Cosa dobbiamo dare in <b>output</b>?',opts:[['L’area del triangolo',1],['L’area del quadrato',0,'Il problema chiede l’area del triangolo, non quella del quadrato.'],['La diagonale',0,'La diagonale ci serve per il calcolo, ma il risultato richiesto è l’area del triangolo.']],ok:'Esatto.'},
  {q:'Come si calcola la <b>diagonale d</b> di un quadrato di lato l?',opts:[['l * Sqrt(2)',1],['l * 2',0,'La diagonale è più corta di due lati messi in fila. Per il teorema di Pitagora è l × √2.'],['l * l',0,'Questa è l’area del quadrato.']],ok:'Giusto: d = l × √2. In Flowgorithm la radice quadrata si scrive Sqrt( ).'},
  {q:'E l’<b>area del triangolo</b>? Base = d, altezza = l.',opts:[['d * l / 2',1],['d * l',0,'Hai dimenticato di dividere per 2: l’area del triangolo è base × altezza / 2.'],['l * l / 2',0,'La base del triangolo è la diagonale, non il lato.']],ok:'Perfetto: base per altezza diviso 2.'}],
 sol:[D('l, d, area','Reale','Tre scatole: lato, diagonale e area. Tutte Reale, perché la radice di 2 ha la virgola.'),I('l','Leggiamo il lato.'),A('d','l * Sqrt(2)','Calcoliamo la diagonale. Sqrt è la radice quadrata.'),A('area','d * l / 2','Area del triangolo: base (d) per altezza (l) diviso 2.'),O('area','Mostriamo il risultato.')],
 wrong:[[A('d','l * 2'),'La diagonale non è il doppio del lato: è l × √2.'],[A('area','d * l'),'Manca la divisione per 2.'],[A('area','l * l'),'Questa è l’area del quadrato, non del triangolo.'],[I('d'),'La diagonale non la chiediamo all’utente: la calcoliamo.'],[D('l, d, area','Intero'),'Con Intero non puoi tenere la virgola, ma l × √2 ce l’ha. Serve Reale.']],
 tests:[[[4],['11.31'],'lato 4 (risultato circa 11.31)'],[[10],['70.71'],'lato 10 (circa 70.71)']],
 bug:{prog:[D('l, d, area','Reale'),I('l'),A('d','l * Sqrt(2)'),BAD(A('area','d * l')),O('area')],q:'Con lato 4 questo programma dà 22.63, cioè il doppio del giusto. <b>Tocca il blocco sbagliato.</b>',why:'Manca “/ 2”: l’area del triangolo è base per altezza <b>diviso 2</b>.',hint:'Il risultato è esattamente il doppio. Quale formula ha un “diviso 2”?'}},
{id:'e5',n:5,mod:3,title:'Ore, minuti e secondi',lvl:1,skills:['analisi','sequenza'],
 text:'Chiedi un orario in <mark>ore, minuti e secondi</mark>. Calcola e scrivi quanti <mark>secondi in tutto</mark> sono.',
 analysis:[
  {q:'Quali sono gli <b>input</b>?',multi:1,opts:[['Le ore',1],['I minuti',1],['I secondi',1],['Il totale in secondi',0,'Il totale è il risultato: output.']],ok:'Giusto: tre dati in ingresso.'},
  {q:'Quanti secondi ci sono in <b>un’ora</b>?',opts:[['3600',1],['60',0,'60 secondi fanno un minuto. Un’ora ha 60 minuti, cioè 60 × 60 secondi.'],['100',0,'Il tempo non si conta a centinaia: un’ora ha 60 minuti da 60 secondi.']],ok:'Esatto: 60 × 60 = 3600.'},
  {q:'Qual è la formula del totale?',opts:[['ore * 3600 + minuti * 60 + secondi',1],['ore * 60 + minuti * 60 + secondi',0,'Le ore vanno moltiplicate per 3600, non per 60.'],['ore + minuti + secondi',0,'Così sommi cose diverse (ore, minuti e secondi) come se fossero uguali. Prima vanno trasformate tutte in secondi.']],ok:'Perfetto: trasformo tutto in secondi e sommo.'}],
 sol:[D('ore, minuti, secondi, tot','Intero','Qui bastano numeri interi.'),I('ore','Leggiamo le ore.'),I('minuti','Poi i minuti.'),I('secondi','Poi i secondi.'),A('tot','ore * 3600 + minuti * 60 + secondi','Trasformiamo tutto in secondi e sommiamo.'),O('tot','Mostriamo il totale.')],
 wrong:[[A('tot','ore * 60 + minuti * 60 + secondi'),'Le ore vanno moltiplicate per 3600.'],[A('tot','ore + minuti + secondi'),'Prima bisogna trasformare ore e minuti in secondi.'],[I('tot'),'Il totale non si chiede: si calcola.'],[O('"tot"'),'Con le virgolette scrivi la parola “tot”, non il valore. Togli le virgolette.']],
 tests:[[[1,30,15],['5415'],'1 ora, 30 minuti e 15 secondi'],[[0,2,5],['125'],'0 ore, 2 minuti e 5 secondi']],

{id:'e6',n:6,mod:4,title:'Lo sconto del 20%',lvl:1,skills:['analisi','selezione'],
