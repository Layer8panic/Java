/* ---------- gioco: fiume ---------- */
function mountRiver(el,onWin){const NM={W:['🐺','lupo'],G:['🐐','capra'],C:['🥬','cavoli']};let pos,cargo,log,over;
  const reset=()=>{pos={F:0,W:0,G:0,C:0};cargo=null;log=[];over=false;render()};
  function render(){const side=pos.F;const bank=s=>Object.keys(NM).filter(k=>pos[k]===s&&cargo!==k).map(k=>`<button class="ani" data-k="${k}" ${pos.F!==s||over?'disabled':''} aria-label="${NM[k][1]}${pos.F===s?', tocca per caricarlo sulla barca':''}">${NM[k][0]}</button>`).join('');
    el.innerHTML=`<div class="ah"><span aria-hidden="true">✋</span>Gioca e scrivi l’algoritmo</div>
      <div class="river"><div class="bank"><div class="lab">Riva di partenza</div>${bank(0)}</div>
      <div class="water"><div class="lab" style="color:#fff">Fiume</div><div class="boatlane"><div class="boat${side?' right':''}" data-boat><span style="font-size:1.6rem" aria-label="contadino">🧑‍🌾</span>${cargo?`<button class="ani" data-un="1" aria-label="${NM[cargo][1]} sulla barca, tocca per scaricarlo">${NM[cargo][0]}</button>`:'<small>barca</small>'}</div></div></div>
      <div class="bank"><div class="lab">Altra riva</div>${bank(1)}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn pri" data-cross ${over?'disabled':''}>⛵ Attraversa${cargo?' con '+NM[cargo][1]:' da solo'}</button><button class="btn" data-reset>↺ Ricomincia</button></div>
      <div data-msg aria-live="polite"></div>
      ${log.length?`<div class="ph" style="margin-top:12px">Il tuo algoritmo</div><ol class="moves">${log.map(m=>`<li>${esc(m)}</li>`).join('')}</ol>`:''}`}
  el.addEventListener('click',e=>{if(e.target.closest('[data-reset]'))return reset();if(over)return;
    const k=e.target.closest('[data-k]');if(k&&!k.disabled){cargo=k.dataset.k;return render()}
    if(e.target.closest('[data-un]')){cargo=null;return render()}
    if(e.target.closest('[data-cross]')){const b=$('[data-boat]',el);b.classList.toggle('right');$$('button',el).forEach(x=>{if(!x.matches('[data-reset]'))x.disabled=true});
      setTimeout(()=>{const to=1-pos.F;pos.F=to;if(cargo)pos[cargo]=to;log.push(cargo?`Porto ${NM[cargo][1]==='cavoli'?'i cavoli':(NM[cargo][1]==='lupo'?'il lupo':'la capra')} ${to?'sull’altra riva':'indietro sulla riva di partenza'}`:`Torno ${to?'sull’altra riva':'indietro'} da solo`);cargo=null;
        const alone=1-pos.F;let bad='';if(pos.W===alone&&pos.G===alone)bad='Oh no! Il lupo ha mangiato la capra 🐺🐐. Erano soli sulla stessa riva.';else if(pos.G===alone&&pos.C===alone)bad='Oh no! La capra ha mangiato i cavoli 🐐🥬. Erano soli sulla stessa riva.';
        render();const m=$('[data-msg]',el);
        if(bad){over=true;render();$('[data-msg]',el).innerHTML=`<div class="fb ko">${bad} Premi Ricomincia e prova un’altra strategia. Suggerimento: chi è l’animale “pericoloso” con tutti e due?</div>`}
        else if(pos.W&&pos.G&&pos.C&&pos.F){over=true;render();$('[data-msg]',el).innerHTML=`<div class="fb ok">🎉 Ce l’hai fatta in ${log.length} viaggi! Le tue mosse qui sotto sono un <b>algoritmo</b>: passi in ordine che risolvono il problema.${log.length===7?' Ed è la soluzione più corta possibile!':' La soluzione più corta ha 7 viaggi: riesci a trovarla?'}</div>`;confetti();onWin()}},SET.rm?0:900)}});
  reset()}

/* ---------- gioco: travasi ---------- */
function mountJugs(el,onWin){const CAP=[25,5,3],H=[180,80,56];let v,sel,log,won;
  const reset=()=>{v=[16,5,3];sel=null;log=[[16,5,3]];won=false;render()};
  function render(){el.innerHTML=`<div class="ah"><span aria-hidden="true">✋</span>Fai i travasi</div>
    <div class="jugs">${CAP.map((c,i)=>`<button class="jug${sel===i?' sel':''}" data-j="${i}" aria-label="Recipiente da ${c} litri, contiene ${v[i]} litri${sel===i?', selezionato':''}"><div class="glass" style="height:${H[i]}px"><div class="w" style="height:${v[i]/c*100}%"></div><div class="num">${v[i]}</div></div><b>${c} L</b></button>`).join('')}</div>
    <p class="small muted" style="margin:8px 0" data-hint aria-live="polite">${won?'':sel===null?'Tocca il recipiente da cui versare.':`Versi dal ${CAP[sel]} L. Ora tocca dove versare (o di nuovo lo stesso per annullare).`}</p>
    <div class="row"><button class="btn" data-reset>↺ Ricomincia</button>${log.length>8&&!won?'<button class="btn" data-help>💡 Aiuto</button>':''}</div><div data-msg aria-live="polite"></div>
    <div class="ph" style="margin-top:12px">Il tuo algoritmo, travaso dopo travaso</div>
    <table class="tbl"><tr><th>#</th><th>25 L</th><th>5 L</th><th>3 L</th></tr>${log.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`}
  el.addEventListener('click',e=>{if(e.target.closest('[data-reset]'))return reset();
    if(e.target.closest('[data-help]')){$('[data-msg]',el).innerHTML='<div class="fb ko">💡 Idea: alla fine nel 25 L ci vogliono 20 litri, quindi negli altri due devono restare 4 litri in tutto (per esempio 1 + 3). Prova a usare il 3 L come “misurino” per lasciare 1 litro nel 5 L.</div>';return}
    const j=e.target.closest('[data-j]');if(!j||won)return;const i=+j.dataset.j;
    if(sel===null){if(!v[i]){$('[data-msg]',el).innerHTML='<div class="fb ko">Questo recipiente è vuoto: non c’è niente da versare.</div>';return}sel=i;return render()}
    if(sel===i){sel=null;return render()}
    const amt=Math.min(v[sel],CAP[i]-v[i]);if(!amt){sel=null;render();$('[data-msg]',el).innerHTML='<div class="fb ko">Il recipiente di arrivo è già pieno.</div>';return}
    v[sel]-=amt;v[i]+=amt;sel=null;log.push([...v]);render();
    if(v[0]===20){won=true;render();$('[data-msg]',el).innerHTML=`<div class="fb ok">🎉 20 litri esatti in ${log.length-1} travasi! La tabella qui sotto è il tuo algoritmo. Ci sono tanti modi per risolverlo: provane un altro!</div>`;confetti();onWin()}});
  reset()}

/* ================= TUTOR ================= */
function Tutor(chat,choices,token){
  const alive=()=>R.token===token;
  const scroll=()=>{try{choices.scrollIntoView({block:'end',behavior:SET.rm?'auto':'smooth'})}catch(e){}};
  async function say(html,cls=''){if(!alive())throw STOP;const m=document.createElement('div');m.className='msg';m.innerHTML=`<div class="av" aria-hidden="true">🦉</div><div class="bub"><span class="typing" aria-label="Il tutor sta scrivendo"><span></span><span></span><span></span></span></div>`;chat.appendChild(m);scroll();
    await sleep(SET.rm?60:Math.min(1100,280+html.replace(/<[^>]+>/g,'').length*9));if(!alive())throw STOP;m.className='msg '+cls;m.querySelector('.bub').innerHTML=html;scroll()}
  function me(html){const m=document.createElement('div');m.className='msg me';m.innerHTML=`<div class="bub">${html}</div>`;chat.appendChild(m)}
  function pick(build){return new Promise(res=>{choices.innerHTML=build;scroll();const h=e=>{const b=e.target.closest('[data-c]');if(!b||b.disabled)return;choices.removeEventListener('click',h);res(b)};choices.addEventListener('click',h);
    R.cleanup.push(()=>choices.removeEventListener('click',h))})}
  return{say,me,pick,alive,clear(){chat.innerHTML='';choices.innerHTML=''},choices}}

function varsRead(n){const out=new Set();const add=src=>{try{const w=a=>{if(!a)return;if(a.k==='var')out.add(a.n.toLowerCase());if(a.a)w(a.a);if(a.b)w(a.b);if(a.args)a.args.forEach(w)};w(parse(src))}catch(e){}};
  if(n.t==='output')add(n.e);if(n.t==='assign')add(n.e);if(n.t==='if'||n.t==='while')add(n.c);return out}
function flattenSteps(seq,ctx,out){for(const n of seq){out.push({n,ctx});
  if(n.t==='if'){const cy={k:'yes',p:n},cn={k:'no',p:n};if(n.yes.length)flattenSteps(n.yes,cy,out);else out.push({empty:'Vero',p:n,ctx:cy});if(n.no.length)flattenSteps(n.no,cn,out);else out.push({empty:'Falso',p:n,ctx:cn})}
  else if(n.body)flattenSteps(n.body,{k:'body',p:n},out)}return out}
function partial(seq,placed,ghost){const o=[];for(const n of seq){if(n.id===ghost){o.push({t:'ghost',id:'ghost'});continue}if(!placed.has(n.id))continue;const c={...n};
  if(n.t==='if'){c.yes=partial(n.yes,placed,ghost);c.no=partial(n.no,placed,ghost)}else if(n.body)c.body=partial(n.body,placed,ghost);o.push(c)}return o}

async function tutorRun(ex){
  const token=R.token;const T=Tutor($('#chat'),$('#choices'),token);const chartCard=$('#exChart');
  const stages=$$('#exSteps span');const stage=i=>stages.forEach((s,j)=>{s.className=j<i?'d':j===i?'c':''});
  const sol=ensureIds(clone(ex.sol));
  try{
    stage(0);
    await T.say(`Ciao! Sono il tuo tutor 🦉. Risolviamo insieme l’<b>esercizio ${ex.n}</b>, un passo alla volta.`);
    await T.say('Per prima cosa <b>leggi bene il testo</b> qui sopra. Le parole evidenziate sono quelle importanti.');
    let b=await T.pick(`<button class="btn pri wide" data-c>Ho letto il problema 👍</button>`);T.me('Ho letto il problema');
    /* ANALISI */
    stage(1);
    for(const q of ex.analysis){await T.say(q.q);
      const order=shuffle(q.opts.map((_,i)=>i));
      if(q.multi){const sel=new Set();
        const draw=()=>`<div class="opts">${order.map(i=>`<button class="opt" data-t="${i}" aria-pressed="${sel.has(i)}"><span class="mk" aria-hidden="true">${sel.has(i)?'✓':''}</span><span>${esc(q.opts[i][0])}</span></button>`).join('')}</div><button class="btn pri wide" data-c style="margin-top:8px">Controlla</button>`;
        const tog=e=>{const t=e.target.closest('[data-t]');if(!t)return;const i=+t.dataset.t;sel.has(i)?sel.delete(i):sel.add(i);t.setAttribute('aria-pressed',sel.has(i));t.querySelector('.mk').textContent=sel.has(i)?'✓':''};
        T.choices.addEventListener('click',tog);R.cleanup.push(()=>T.choices.removeEventListener('click',tog));
        for(;;){b=await T.pick(draw());const chosen=[...sel];T.me(chosen.length?chosen.map(i=>esc(q.opts[i][0])).join(', '):'(niente)');
          const wrong=chosen.filter(i=>!q.opts[i][1]),miss=q.opts.map((o,i)=>i).filter(i=>q.opts[i][1]&&!sel.has(i));
          if(!wrong.length&&!miss.length){T.choices.removeEventListener('click',tog);await T.say('✅ '+q.ok,'good');break}
          let m=wrong.map(i=>'• '+esc(q.opts[i][2]||`“${q.opts[i][0]}” non c’entra.`)).join('<br>');
          if(miss.length)m+=(m?'<br>':'')+`• Manca ancora qualcosa: ${miss.length===1?'c’è un’altra risposta giusta':'ci sono altre risposte giuste'}. Rileggi il testo.`;
          await T.say('Quasi! '+m+'<br>Correggi e premi di nuovo Controlla.','bad')}}
      else{const tried=new Set();
        for(;;){b=await T.pick(`<div class="opts">${order.map(i=>`<button class="opt" data-c data-i="${i}"${tried.has(i)?' disabled':''}><span class="mk" aria-hidden="true">${tried.has(i)?'✗':''}</span><span>${esc(q.opts[i][0])}</span></button>`).join('')}</div>`);
          const i=+b.dataset.i,o=q.opts[i];T.me(esc(o[0]));
          if(o[1]){await T.say('✅ '+q.ok,'good');break}tried.add(i);await T.say('Non proprio. '+esc(o[2]||'')+' Riprova.','bad')}}}
    await T.say('Ottima analisi! 🎯 Ora sai <b>cosa entra</b>, <b>cosa esce</b> e <b>come collegarli</b>. Adesso costruiamo il diagramma.');
    await T.pick(`<button class="btn pri wide" data-c>Costruiamo il diagramma 🔧</button>`);
    /* COSTRUZIONE */
    stage(2);T.clear();chartCard.hidden=false;
    const steps=flattenSteps(sol,{k:'top'},[]);const placed=new Set();const seenCtx=new Set();let setVars=new Set();let lastNew=null;
    const show=ghost=>{const p=ghost==='END'?partial(sol,placed,null).concat([{t:'ghost',id:'ghost'}]):partial(sol,placed,ghost);
      chartCard.innerHTML=`<div class="ph">Il tuo diagramma</div><div class="chartwrap" style="max-height:44vh">${renderChart(p,{newId:lastNew}).html}</div>`;
      const g=chartCard.querySelector('.k-ghost');if(g)try{const w=chartCard.querySelector('.chartwrap');const gb=g.getBoundingClientRect(),wb=w.getBoundingClientRect();w.scrollTop+=gb.top-wb.top-wb.height/2;w.scrollLeft+=gb.left-wb.left-wb.width/2+gb.width/2}catch(e){}};
    let prev=null;
    for(let si=0;si<steps.length;si++){const s=steps[si];
      if(s.empty){show(null);await T.say(`Nel ramo <b>${s.empty}</b> non c’è niente da fare: lo lasciamo vuoto e andiamo avanti.`);prev=s;continue}
      const n=s.n,c=s.ctx;show(n.id);
      let pr;const first=!seenCtx.has(c);seenCtx.add(c);
      if(c.k==='yes')pr=first?`Siamo nel ramo <b>Vero</b> (quando <code>${esc(c.p.c)}</code> è vera). Cosa facciamo?`:'Sempre nel ramo <b>Vero</b>: e poi?';
      else if(c.k==='no')pr=first?`Ora il ramo <b>Falso</b> (quando <code>${esc(c.p.c)}</code> è falsa). Cosa facciamo?`:'Sempre nel ramo <b>Falso</b>: e poi?';
      else if(c.k==='body')pr=first?`Siamo <b>dentro il ciclo</b>: questi blocchi si ripetono finché <code>${esc(c.p.c)}</code> è vera. Qual è il primo?`:(prev&&prev.ctx!==c?'Usciamo dal rombo, ma restiamo <b>dentro il ciclo</b>. Cosa manca?':'Sempre dentro il ciclo: e poi?');
      else pr=si===0?'Dopo <b>Inizio</b>, qual è il primo blocco?':(prev&&prev.ctx!==c?`Usciamo dal ${prev.ctx.p&&prev.ctx.p.t==='if'?'rombo':'ciclo'}. Cosa viene <b>dopo</b>?`:'Qual è il prossimo blocco?');
      await T.say(pr);
      /* opzioni */
      const lab=blockLabel(n);let fut=null,futWhy='';
      if(n.t==='declare'){const f=steps.slice(si+1).find(x=>x.n&&x.n.t==='input');if(f){fut=f.n;futWhy='Non ancora! In Flowgorithm, prima di usare una variabile, bisogna <b>dichiararla</b>.'}}
      else for(const x of steps.slice(si+1,si+6)){if(!x.n||blockLabel(x.n)===lab)continue;const miss=[...varsRead(x.n)].filter(v=>!setVars.has(v));if(miss.length){fut=x.n;futWhy=`Non ancora! Questo blocco usa <b>${esc(miss[0])}</b>, che in questo momento non ha ancora un valore. Prima bisogna leggerla o calcolarla.`;break}}
      let wr=shuffle(ex.wrong.filter(w=>blockLabel(w[0])!==lab&&(!fut||blockLabel(w[0])!==blockLabel(fut))));wr.sort((a,b)=>(b[0].t===n.t)-(a[0].t===n.t));
      const opts=[{n,ok:1}];if(fut)opts.push({n:fut,why:futWhy});for(const w of wr){if(opts.length>=3)break;opts.push({n:w[0],why:esc(w[1])})}
      const ord=shuffle(opts.map((_,i)=>i));const no=new Set();let errs=0;
      for(;;){b=await T.pick(ord.map(i=>`<button class="bopt${no.has(i)?' no':''}${errs>=3&&opts[i].ok?' hint':''}" data-c data-i="${i}"${no.has(i)?' disabled':''} aria-label="${esc(KNAME[opts[i].n.t]+': '+blockLabel(opts[i].n))}">${miniBlock(opts[i].n)}</button>`).join(''));
        const o=opts[+b.dataset.i];T.me(esc(blockLabel(o.n)));
        if(o.ok){placed.add(n.id);lastNew=n.id;if(n.t==='input'||n.t==='assign')setVars.add(n.v.toLowerCase());show(null);await T.say('✅ '+(n.tip||'Giusto!'),'good');break}
        errs++;no.add(+b.dataset.i);let m=o.why;if(errs===2)m+=`<br>💡 <b>Aiutino:</b> ${esc(n.hint||TYPEHINT[n.t]||'')}`;if(errs>=3)m+='<br>Ti ho evidenziato quello giusto in arancione.';
        await T.say(m,'bad')}
      prev=s;lastNew=null}
    show('END');await T.say('Abbiamo messo tutti i blocchi. Con cosa si chiude il diagramma?');
    for(;;){const ws=shuffle(ex.wrong).slice(0,2);const o=shuffle([{n:{t:'term',txt:'Fine'},ok:1},...ws.map(w=>({n:w[0],why:w[1]}))]);
      b=await T.pick(o.map((x,i)=>`<button class="bopt" data-c data-i="${i}">${miniBlock(x.n)}</button>`).join(''));const x=o[+b.dataset.i];T.me(esc(blockLabel(x.n)));
      if(x.ok)break;await T.say('Il problema è già risolto: non serve altro. Ogni algoritmo deve avere una fine!','bad')}
    chartCard.innerHTML=`<div class="ph">Il tuo diagramma</div><div class="chartwrap" style="max-height:44vh">${renderChart(sol,{draw:true}).html}</div>`;
    confetti();await T.say('🎉 Diagramma completo! Ogni blocco è al suo posto.','good');
    await T.pick(`<button class="btn pri wide" data-c>Proviamo se funziona ▶</button>`);
    /* SIMULAZIONE */
    stage(3);T.clear();chartCard.innerHTML='<div data-run></div>';let ran=false;
    const tdesc=t=>`${esc(t[2])}. Dovresti vedere: <b>${t[1].length>6?esc(t[1].slice(0,3).join(', '))+' … '+esc(t[1][t[1].length-1]):esc(t[1].join(' · '))}</b>`;
    mountRunner($('[data-run]',chartCard),{prog:sol,onFinish:async res=>{ran=true;if(!T.alive())return;
      const t=ex.tests.find(t=>t[0].length===res.ins.length&&t[0].every((v,i)=>sameOut(v,res.ins[i])));
      try{if(t){const good=t[1].length===res.outs.length&&t[1].every((v,i)=>sameOut(v,res.outs[i]));await T.say(good?'✅ Risultato giusto: proprio quello che ci aspettavamo!':'Hmm, il risultato non è quello atteso. Controlla i dati che hai inserito.',good?'good':'bad')}
        else await T.say('Hai provato con dati tuoi: bravo! 👏 Controlla a mente se il risultato è giusto. È proprio questo il senso della <b>simulazione</b>.')}catch(e){}},
      onError:async e=>{try{await T.say('Il programma si è fermato con un errore: '+esc(e.message)+' Leggi il messaggio sulla console e riprova.','bad')}catch(x){}}});
    await T.say(`Questa è la fase di <b>simulazione</b>: verifichiamo che l’algoritmo funzioni. Premi <b>▶ Esegui</b> e inserisci ${tdesc(ex.tests[0])}`);
    if(ex.tests.length>1)await T.say(`Poi prova anche con ${tdesc(ex.tests[1])}${ex.tests[2]?'. E con '+tdesc(ex.tests[2]):''}`);
    for(;;){b=await T.pick(`<button class="btn wide" data-c data-k="auto">🧪 Fai il test automatico</button><button class="btn pri wide" data-c data-k="ok">Ho provato: funziona ✓</button>`);
      if(b.dataset.k==='auto'){T.me('Fai il test automatico');const rows=ex.tests.map(t=>{const r=runHeadless(sol,t[0]);const good=!r.error&&t[1].length===r.outs.length&&t[1].every((v,i)=>sameOut(v,r.outs[i]));return`${good?'✅':'❌'} ${esc(t[2])}`});
        await T.say('Ho eseguito il programma con tutti i dati di prova:<br>'+rows.join('<br>')+'<br>Tutto funziona! Provare tanti casi diversi (anche quelli “strani”) è il modo per essere sicuri.','good');ran=true;continue}
      if(!ran){T.me('Ho provato');await T.say('Prima prova a eseguirlo almeno una volta, oppure fai il test automatico. 😉','bad');continue}
      T.me('Funziona ✓');break}
    /* TROVA L'ERRORE */
    if(ex.bug){stage(4);T.clear();const bp=ensureIds(clone(ex.bug.prog));let bad=null;walk(bp,n=>{if(n.bad)bad=n.id});
      await T.say('Ultima sfida: <b>trova l’errore</b> 🔍');await T.say(ex.bug.q);
      let tries=0;const mark={};
      await new Promise(res=>{chartCard.innerHTML='<div class="ph">Il programma del compagno: tocca un blocco</div><div data-bug></div>';
        const host=$('[data-bug]',chartCard);
        const draw=()=>{host.innerHTML=`<div class="chartwrap" style="max-height:52vh">${renderChart(bp,{tap:true,mark}).html}</div>`};draw();
        const h=async e=>{const g=e.target.closest('.blk');if(!g||!T.alive())return;const id=g.dataset.id;if(id==='start'||id==='end'||mark[id])return;
          if(id===bad){mark[id]='bugok';draw();host.removeEventListener('click',h);try{await T.say('✅ Trovato! '+ex.bug.why,'good')}catch(x){}res()}
          else{tries++;mark[id]='bugno';draw();try{await T.say(tries>=2?'Quel blocco va bene. 💡 '+esc(ex.bug.hint):'Quel blocco va bene. Cerca ancora…','bad')}catch(x){}}};
        host.addEventListener('click',h);host.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.blk')){e.preventDefault();h(e)}});R.cleanup.push(()=>{host.removeEventListener('click',h);res()})});
      if(!T.alive())throw STOP;addSkill('debug',ex.id)}
    /* FINE */
    stage(stages.length-1);PROG.ex[ex.id]=1;save();(ex.skills||[]).forEach(s=>addSkill(s,ex.id));addSkill('simulatore',ex.id);if(ex.mod===3)addSkill('sequenza',ex.id);
    confetti();const next=EXS[EXS.findIndex(e=>e.id===ex.id)+1];
    await T.say(`🏆 <b>Esercizio ${ex.n} completato!</b> Hai fatto l’analisi, costruito l’algoritmo, l’hai provato${ex.bug?' e hai trovato un errore':''}. Proprio come un programmatore.`,'good');
    T.choices.innerHTML=`<button class="btn pri wide" data-sim>▶️ Apri nel simulatore e modificalo</button>${next?`<a class="btn wide" href="#/es/${next.id}">Esercizio ${next.n}: ${esc(next.title)} →</a>`:''}<a class="btn wide ghost" href="#/lab">Torna al laboratorio</a>`;
    $('[data-sim]',T.choices).addEventListener('click',()=>{if(simDirty()&&!confirm('Nel simulatore c’è già un diagramma. Vuoi sostituirlo con questo?'))return;store.set('sim',clone(ex.sol));store.set('simtask',{title:'Esercizio '+ex.n+': '+ex.title,text:ex.text});location.hash='#/sim'});
  }catch(e){if(e!==STOP)console.error(e)}}
const simDirty=()=>(store.get('sim',[])||[]).length>0;

/* ================= SCHERMATE ================= */
const totalSlides=MODULES.reduce((a,m)=>a+m.slides.length,0);
function overall(){const d=Object.keys(PROG.done).length,e=Object.keys(PROG.ex).length;return Math.round((d/totalSlides*.5+e/EXS.length*.5)*100)}
function lvlStars(n){return '<span aria-label="difficoltà '+n+' su 3">'+'●'.repeat(n)+'<span style="opacity:.25">'+'●'.repeat(3-n)+'</span></span>'}

function home(){const pct=overall();const last=PROG.last;
  const skDone=SKILLS.filter(s=>skillLv(s[0])>0).length;
  main.innerHTML=`<section class="hero"><svg class="float" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="4" width="44" height="15" fill="#FFFFC0" stroke="#fff" stroke-width="2"/><path d="M32 13 58 32 32 51 6 32z" fill="#FFC0C0" stroke="#fff" stroke-width="2"/><path d="M14 46h44l-6 14H8z" fill="#C0E0FF" stroke="#fff" stroke-width="2"/></svg>
    <h2>Diagrammi di flusso da zero</h2><p>Impara a far ragionare un computer, un blocco alla volta. Con Flowgorithm.</p>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avanzamento del corso"><i style="width:${pct}%"></i></div><p class="small" style="margin:6px 0 10px">Hai completato il ${pct}% del corso</p>
    <a class="btn" style="background:#fff;color:#2D6CB5;border:0" href="#/${last||'lezione/0/0'}">${last?'▶ Continua da dove eri':'▶ Comincia il corso'}</a></section>
  <div class="tiles">
    <a class="tile" href="#/lezioni"><span class="i" aria-hidden="true">📘</span><b>Lezioni</b><span>La teoria spiegata semplice, con un’attività in ogni pagina</span></a>
    <a class="tile" href="#/lab"><span class="i" aria-hidden="true">🧪</span><b>Laboratorio</b><span>15 esercizi con il tutor che ti segue passo passo</span></a>
    <a class="tile" href="#/sim"><span class="i" aria-hidden="true">▶️</span><b>Simulatore</b><span>Il tuo Flowgorithm sul telefono: costruisci ed esegui</span></a>
    <a class="tile" href="#/video"><span class="i" aria-hidden="true">🎬</span><b>Video</b><span>Le videolezioni e gli esercizi per casa</span></a></div>
  <a class="item" href="#/competenze"><span class="i" aria-hidden="true">🏅</span><span class="tx"><b>Le mie competenze</b><span>${skDone} su ${SKILLS.length} acquisite</span></span><span class="st" aria-hidden="true">›</span></a>
  <div style="height:10px"></div>
  <button class="item" data-settings><span class="i" aria-hidden="true">⚙️</span><span class="tx"><b>Impostazioni e accessibilità</b><span>Testo più grande, contrasto, animazioni</span></span><span class="st" aria-hidden="true">›</span></button>`;
  $('[data-settings]').addEventListener('click',settings)}

const modDone=m=>!!(PROG.mods&&PROG.mods[m.id])||m.slides.every((_,j)=>PROG.done[`m${m.id}s${j}`]);
function lessons(){main.innerHTML=`<h2>Lezioni</h2><p class="muted">Segui l’ordine: ogni lezione usa quello che hai imparato prima. Dopo la lezione 3 sai già disegnare il tuo primo diagramma.</p><div class="list">${MODULES.map((m,i)=>{const d=m.slides.filter((_,j)=>PROG.done[`m${m.id}s${j}`]).length;const all=modDone(m);const pc=all?100:Math.round(d/m.slides.length*100);
  return `<a class="item lesson${all?' done':''}" href="#/lezione/${i}/0"><span class="i" aria-hidden="true">${all?'✅':m.icon}</span><span class="tx"><b>${i+1}. ${esc(m.title)}</b><span>${esc(m.sub)} · ${m.slides.length} pagine · circa ${m.min} minuti</span><span class="bar mini-bar"><i style="width:${pc}%"></i></span></span><span class="st">${all?'<span class="chip ok">Fatta</span>':pc?pc+'%':'›'}</span></a>`}).join('')}</div>`}

function slide(mi,si){const m=MODULES[mi];if(!m)return go('#/lezioni');
  if(si==='end')return moduleEnd(mi);si=+si;const s=m.slides[si];if(!s)return go(`#/lezione/${mi}/0`);
  PROG.last=`lezione/${mi}/${si}`;save();
  const key=`m${m.id}s${si}`;const done=!!PROG.done[key];
  main.innerHTML=`<div class="slidehead"><span class="chip">${m.icon} Lezione ${mi+1}</span><span class="small muted">${si+1} di ${m.slides.length}</span><div class="dots" aria-label="Pagina ${si+1} di ${m.slides.length}">${m.slides.map((_,j)=>`<i class="${j===si?'c':PROG.done[`m${m.id}s${j}`]?'d':''}"></i>`).join('')}</div></div>
    <article class="slide card"><h2>${esc(s.t)}</h2><div class="rv">${fillSlide(s.h)}</div><div class="act" data-act></div></article>
    <div class="slidenav"><button class="btn" data-prev ${si===0&&mi===0?'disabled':''}>← Indietro</button><button class="btn pri" data-next ${done||SET.lim?'':'disabled'}>${si===m.slides.length-1?'Fine lezione ✓':'Avanti →'}</button></div>
    <p class="small muted" data-lock style="text-align:center;margin-top:-6px">${done||SET.lim?'':'Completa l’attività per andare avanti'}</p>`;
  drawCharts(main);
  const race=$('[data-race-go]');race&&race.addEventListener('click',()=>{$$('.lane',main).forEach(l=>{l.classList.remove('go');void l.offsetWidth;l.classList.add('go')})});
  mountAct($('[data-act]'),s.act,()=>{PROG.done[key]=1;if(s.act.skill)addSkill(s.act.skill,key);save();const n=$('[data-next]');n.disabled=false;n.classList.add('pop');$('[data-lock]').textContent='';announce('Attività completata. Puoi andare avanti.')});
  $('[data-prev]').addEventListener('click',()=>go(si>0?`#/lezione/${mi}/${si-1}`:`#/lezione/${mi-1}/${MODULES[mi-1].slides.length-1}`));
  $('[data-next]').addEventListener('click',()=>{PROG.done[key]=1;save();go(si<m.slides.length-1?`#/lezione/${mi}/${si+1}`:`#/lezione/${mi}/end`)})}

function moduleEnd(mi){const m=MODULES[mi];const nx=MODULES[mi+1];confetti();PROG.mods=PROG.mods||{};PROG.mods[m.id]=1;m.slides.forEach((_,j)=>PROG.done[`m${m.id}s${j}`]=1);save();
  main.innerHTML=`<section class="card" style="text-align:center"><div style="font-size:3rem" aria-hidden="true">🎉</div><h2>Lezione ${mi+1} completata! ✅</h2><p>${esc(m.title)}</p></section>
  ${m.ex&&m.ex.length?`<section class="card"><h3>🧪 Ora mettiti alla prova</h3><p class="muted small">Il tutor ti segue passo passo.</p><div class="list">${m.ex.map(id=>{const e=EXS.find(x=>x.id===id);return `<a class="item${PROG.ex[id]?' done':''}" href="#/es/${id}"><span class="i">${PROG.ex[id]?'✅':e.n}</span><span class="tx"><b>${esc(e.title)}</b><span>Esercizio ${e.n} · ${lvlStars(e.lvl)}</span></span></a>`}).join('')}</div></section>`:''}
  <div class="row">${nx?`<a class="btn pri" href="#/lezione/${mi+1}/0">Lezione ${mi+2}: ${esc(nx.title)} →</a>`:`<a class="btn pri" href="#/competenze">🏅 Guarda le tue competenze</a>`}<a class="btn" href="#/lezioni">Tutte le lezioni</a></div>`}

function lab(){main.innerHTML=`<h2>Laboratorio</h2><p class="muted">Ogni esercizio si fa con il tutor: analisi, brainstorming, costruzione del diagramma, prova e caccia all’errore. Quelli che non fate in classe sono per casa.</p>
  ${MODULES.filter(m=>m.ex&&m.ex.length).map(m=>`<h3 style="margin-top:16px">${m.icon} ${esc(m.title)}</h3><div class="list">${m.ex.map(id=>{const e=EXS.find(x=>x.id===id);return `<a class="item${PROG.ex[id]?' done':''}" href="#/es/${id}"><span class="i" aria-hidden="true">${PROG.ex[id]?'✅':e.game?'🎮':e.n}</span><span class="tx"><b>${e.n}. ${esc(e.title)}</b><span>${e.verifica?'<span class="chip warn">verifica</span> ':''}${e.game?'gioco · ':''}${lvlStars(e.lvl)}</span></span><span class="st" aria-hidden="true">›</span></a>`}).join('')}</div>`).join('')}`}

function exercise(id){const ex=EXS.find(e=>e.id===id);if(!ex)return go('#/lab');PROG.last='es/'+id;save();
  const sol=SET.lim&&ex.sol?`<button class="btn sm ghost" data-sol style="opacity:.6">👁 Soluzione (docente)</button>`:'';
  if(ex.game){main.innerHTML=`<section class="card"><div class="row"><span class="chip">Esercizio ${ex.n}</span>${lvlStars(ex.lvl)}</div><h2>${esc(ex.title)}</h2><p>${ex.text}</p></section><section class="card" data-g></section><div class="row" data-after></div>`;
    (ex.game==='river'?mountRiver:mountJugs)($('[data-g]'),()=>{PROG.ex[id]=1;save();(ex.skills||[]).forEach(s=>addSkill(s,id));const nx=EXS[EXS.indexOf(ex)+1];
      $('[data-after]').innerHTML=`<a class="btn pri" href="#/es/${nx.id}">Esercizio ${nx.n} →</a><a class="btn" href="#/lab">Laboratorio</a>`});return}
  main.innerHTML=`<div class="exhead" id="exSteps" aria-label="Fasi dell’esercizio">${['Problema','Analisi','Algoritmo','Simulazione',...(ex.bug?['Trova l’errore']:[]),'Fatto'].map(s=>`<span>${s}</span>`).join('')}</div>
   <div class="exgrid"><div><section class="card"><div class="row"><span class="chip">Esercizio ${ex.n}</span>${ex.verifica?'<span class="chip warn">verifica</span>':''}${lvlStars(ex.lvl)}${sol}</div><h2>${esc(ex.title)}</h2><p>${ex.text}</p></section>
   <section class="card" id="exChart" hidden></section></div>
   <section class="card tutorbox" aria-label="Tutor"><div class="chat" id="chat" aria-live="polite"></div><div class="choices" id="choices"></div></section></div>`;
  const sb=$('[data-sol]');sb&&sb.addEventListener('click',()=>{const c=$('#exChart');c.hidden=false;c.innerHTML=`<div class="ph">Soluzione</div><div class="chartwrap">${renderChart(ensureIds(clone(ex.sol)),{draw:true}).html}</div>`;c.scrollIntoView({behavior:'smooth'})});
  tutorRun(ex)}

function sim(){const task=store.get('simtask',null);let prog=ensureIds(store.get('sim',[])||[]);
  main.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Simulatore</h2><div class="row"><button class="btn sm" data-ex>📂 Esempi</button><button class="btn sm" data-new>🗒️ Nuovo</button></div></div>
   <p class="small muted" style="margin:6px 0 12px">Tocca <b>+</b> sulle frecce per aggiungere un blocco. Tocca un blocco per modificarlo, spostarlo o eliminarlo. Poi premi ▶ Esegui.</p>
   ${task?`<div class="callout" data-task><b>📝 ${esc(task.title)}</b><br>${task.text}<div style="margin-top:6px"><button class="btn sm ghost" data-closetask>Nascondi</button></div></div>`:''}
   <section class="card" data-run></section>
   <details class="card"><summary><b>📝 Versione testuale (pseudocodice)</b></summary><pre data-pseudo style="white-space:pre-wrap;font-size:.92rem;margin:10px 0 0"></pre></details>
   <details class="card"><summary><b>❓ Come si scrive in Flowgorithm</b></summary><div class="small" style="margin-top:8px">
   <p>• Testo tra virgolette: <code>"Ciao"</code> · Unire testo e valori: <code>"Area: " &amp; area</code><br>• Uguale: <code>=</code> oppure <code>==</code> · Diverso: <code>!=</code> · E: <code>and</code> · O: <code>or</code><br>• Radice: <code>Sqrt(x)</code> · Potenza: <code>x ^ 2</code> · Resto: <code>x mod 2</code> (o <code>%</code>)<br>• Decimali con il punto: <code>2.5</code></p></div></details>`;
  const pse=()=>{$('[data-pseudo]').textContent='Inizio\n'+pseudo(prog,1)+'Fine'};
  const run=mountRunner($('[data-run]'),{prog,editable:true,onChange:p=>{prog=p;store.set('sim',p);pse()}});pse();
  $('[data-new]').addEventListener('click',()=>{if(prog.length&&!confirm('Vuoi cancellare il diagramma e ricominciare da capo?'))return;prog=[];store.set('sim',prog);store.set('simtask',null);sim()});
  const ct=$('[data-closetask]');ct&&ct.addEventListener('click',()=>{store.set('simtask',null);$('[data-task]').remove()});
  $('[data-ex]').addEventListener('click',()=>{const L=[['primo','Ciao!','Il programma più corto'],['ciao','Ciao, nome','Input di testo e Output'],['tre','Somma di due numeri','Sequenza'],['media','Ammesso o non ammesso','Il rombo'],['conta','Conta fino a 20','Il ciclo']];
    const done=EXS.filter(e=>e.sol&&PROG.ex[e.id]);
    const s=sheet(`<h3>Apri un esempio</h3><div class="list">${L.map(([k,t,d])=>`<button class="item" data-k="d:${k}"><span class="i">📄</span><span class="tx"><b>${t}</b><span>${d}</span></span></button>`).join('')}
      ${done.map(e=>`<button class="item" data-k="e:${e.id}"><span class="i">✅</span><span class="tx"><b>Esercizio ${e.n}</b><span>${esc(e.title)}</span></span></button>`).join('')}</div>
      ${done.length?'':'<p class="small muted">Qui compariranno anche le soluzioni degli esercizi che completi nel laboratorio.</p>'}<div class="row end"><button class="btn x" data-x>Chiudi</button></div>`);
    s.addEventListener('click',e=>{if(e.target.closest('[data-x]'))return closeSheet();const b=e.target.closest('[data-k]');if(!b)return;if(prog.length&&!confirm('Il diagramma attuale verrà sostituito. Continuare?'))return;
      const [t,k]=b.dataset.k.split(':');prog=ensureIds(clone(t==='d'?DEMO[k]:EXS.find(x=>x.id===k).sol));store.set('sim',prog);store.set('simtask',null);closeSheet();sim()})})}

function videos(){main.innerHTML=`<h2>Video</h2><p class="muted">Puoi guardarli quando vuoi, in qualsiasi ordine. Sotto ogni video trovi degli esercizi da fare nel simulatore.</p>
  ${VIDEOS.map((v,i)=>`<section class="card"><h3>${esc(v.title)}</h3><button class="yt" data-yt="${i}" aria-label="Guarda il video: ${esc(v.title)}"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy"><span class="pl" aria-hidden="true">▶</span></button>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-seen="${i}" aria-pressed="${!!PROG.videos[v.id]}">${PROG.videos[v.id]?'✅ Visto':'Segna come visto'}</button><a class="btn sm ghost" href="https://www.youtube.com/watch?v=${v.id}${v.start?'&t='+v.start+'s':''}" target="_blank" rel="noopener">Apri su YouTube ↗</a></div>
   ${v.ex.length?`<div class="ph" style="margin-top:12px">Esercizi di allenamento (per casa)</div><div class="list">${v.ex.map((t,j)=>`<button class="item" data-hw="${i}:${j}"><span class="i">${j+1}</span><span class="tx"><b style="font-weight:500">${esc(t)}</b><span>Fallo nel simulatore ›</span></span></button>`).join('')}</div>`:''}</section>`).join('')}`;
  main.addEventListener('click',videoClick);R.cleanup.push(()=>main.removeEventListener('click',videoClick))}
function videoClick(e){const y=e.target.closest('[data-yt]');if(y){const v=VIDEOS[+y.dataset.yt];y.outerHTML=`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0${v.start?'&start='+v.start:''}" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;return}
  const s=e.target.closest('[data-seen]');if(s){const v=VIDEOS[+s.dataset.seen];PROG.videos[v.id]=!PROG.videos[v.id];save();s.textContent=PROG.videos[v.id]?'✅ Visto':'Segna come visto';s.setAttribute('aria-pressed',!!PROG.videos[v.id]);return}
  const h=e.target.closest('[data-hw]');if(h){const [i,j]=h.dataset.hw.split(':').map(Number);if(simDirty()&&!confirm('Vuoi iniziare un diagramma nuovo per questo esercizio? Quello attuale nel simulatore verrà cancellato.'))return;
    store.set('sim',[]);store.set('simtask',{title:`${VIDEOS[i].title} · esercizio ${j+1}`,text:esc(VIDEOS[i].ex[j])+'<br><span class="small muted">Prima l’analisi (cosa entra, cosa esce, che calcolo serve), poi i blocchi, poi provalo con dati di cui conosci il risultato.</span>'});go('#/sim')}}

function skills(){const tot=SKILLS.reduce((a,s)=>a+skillLv(s[0]),0),max=SKILLS.length*3,pct=Math.round(tot/max*100);const r=46,C=2*Math.PI*r;
  const where={fasi:'Lezione 1',analisi:'Lezione 1 ed esercizi 3-5',blocchi:'Lezione 2',variabili:'Lezione 2',sequenza:'Esercizi 3, 4, 5',selezione:'Lezione 3 ed esercizi 6-10',ciclo:'Lezione 4 ed esercizi 11-13',simulatore:'Simulazioni nelle lezioni e negli esercizi',debug:'“Trova l’errore” negli esercizi'};
  main.innerHTML=`<h2>Le mie competenze</h2><section class="card" style="text-align:center">
   <svg class="ring" viewBox="0 0 110 110" role="img" aria-label="Competenze al ${pct}%"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 55 55)" style="transition:stroke-dashoffset 1s"/><text x="55" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${pct}%</text></svg>
   <p style="margin-top:8px">${pct>=100?'🏆 <b>Hai tutte le competenze, consolidate.</b> Sei pronto a usare Flowgorithm sul computer!':pct>=60?'Sei sulla buona strada. Ogni pallino in più vuol dire che hai usato quella competenza un’altra volta.':'Ogni attività e ogni esercizio aggiunge un pallino. Tre pallini = competenza consolidata.'}</p></section>
   <section class="card">${SKILLS.map(([k,t])=>{const l=skillLv(k);return `<div class="sk"><span style="font-size:1.3rem" aria-hidden="true">${l>=3?'🏅':l?'✅':'⬜'}</span><div style="flex:1"><b>${esc(t)}</b><div class="small muted">${l?(l>=3?'Consolidata':'Acquisita, continua ad allenarla'):'Da fare: '+where[k]}</div></div><div class="lv" aria-label="livello ${l} su 3">${[0,1,2].map(i=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div>`}).join('')}</section>`}

function settings(){const s=sheet(`<h3>Impostazioni e accessibilità</h3>
  <div class="fld"><label>Grandezza del testo</label><div class="seg">${[1,2,3,4].map(n=>`<button data-fs="${n}" aria-pressed="${SET.fs===n}" style="font-size:${.75+n*.12}rem">A</button>`).join('')}</div></div>
  <div class="fld"><label>Come si scrive l’assegnazione</label><div class="seg"><button data-no="=" aria-pressed="${SET.notation==='='}">a = 2 (come Flowgorithm)</button><button data-no="←" aria-pressed="${SET.notation==='←'}">a ← 2 (come sui libri)</button></div></div>
  <div class="list" style="margin-top:10px">
   <button class="item" data-t="hc" aria-pressed="${SET.hc}"><span class="i">🌓</span><span class="tx"><b>Contrasto alto</b><span>${SET.hc?'Attivo':'Spento'}</span></span></button>
   <button class="item" data-t="rm" aria-pressed="${SET.rm}"><span class="i">🧘</span><span class="tx"><b>Riduci le animazioni</b><span>${SET.rm?'Attivo':'Spento'}</span></span></button>
   <button class="item" data-t="lim" aria-pressed="${SET.lim}"><span class="i">🖥️</span><span class="tx"><b>Modalità LIM (docente)</b><span>Tutto lo schermo, testi grandi, avanzamento libero, soluzioni visibili. Si attiva anche con l’icona in alto a destra.</span></span></button>
   <button class="item" data-reset><span class="i">🗑️</span><span class="tx"><b>Azzera i progressi</b><span>Ricomincia il corso da capo</span></span></button></div>
  <div class="row end" style="margin-top:12px"><button class="btn pri x" data-x>Fatto</button></div>`);
  s.addEventListener('click',e=>{if(e.target.closest('[data-x]')){closeSheet();route();return}
    const f=e.target.closest('[data-fs]');if(f){SET.fs=+f.dataset.fs;applySettings();$$('[data-fs]',s).forEach(b=>b.setAttribute('aria-pressed',b===f))}
    const no=e.target.closest('[data-no]');if(no){SET.notation=no.dataset.no;applySettings();$$('[data-no]',s).forEach(b=>b.setAttribute('aria-pressed',b===no))}
    const t=e.target.closest('[data-t]');if(t){const k=t.dataset.t;SET[k]=!SET[k];applySettings();t.setAttribute('aria-pressed',SET[k]);t.querySelector('.tx span').textContent=SET[k]?'Attivo':'Spento'}
    if(e.target.closest('[data-reset]')&&confirm('Sicuro? Tutti i progressi e le competenze verranno cancellati.')){Object.assign(PROG,{done:{},ex:{},skills:{},videos:{},mods:{},last:''});save();store.set('sim',[]);store.set('simtask',null);closeSheet();go('#/');route()}})}

/* ================= ROUTER ================= */
function go(h){if(location.hash===h)route();else location.hash=h}
const TITLES={'':'Flowchart Lab',lezioni:'Lezioni',lezione:'Lezione',lab:'Laboratorio',es:'Esercizio',sim:'Simulatore',video:'Video',competenze:'Competenze'};
function route(){R.cleanup.forEach(f=>{try{f()}catch(e){}});R.cleanup=[];R.token={};closeSheet();
  const h=location.hash.replace(/^#\/?/,'');const [a='',b,c]=h.split('/');
  try{
    ({'':home,lezioni:lessons,lezione:()=>slide(+b,c),lab,es:()=>exercise(b),sim,video:videos,competenze:skills}[a]||home)();
  }catch(e){console.error(e);$('#main').innerHTML=`<div class="card"><h2>Ops!</h2><p>Qualcosa non ha funzionato in questa pagina. Torna alla <a href="#/">Home</a>.</p></div>`}
  const navKey={'':'home',lezioni:'lezioni',lezione:'lezioni',lab:'lab',es:'lab',sim:'sim',video:'video',competenze:'home'}[a]||'home';
  $$('.nav a').forEach(x=>{if(x.dataset.nav===navKey)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
  const t=a==='lezione'&&MODULES[+b]?MODULES[+b].title:a==='es'?(EXS.find(e=>e.id===b)||{}).title||'Esercizio':TITLES[a]||'Flowchart Lab';
  $('#title').textContent=t;document.title=t+' · Flowchart Lab';$('#backBtn').hidden=!a;
  window.scrollTo(0,0)}
$('#backBtn').addEventListener('click',()=>{const h=location.hash.replace(/^#\/?/,'').split('/');if(h[0]==='lezione')go('#/lezioni');else if(h[0]==='es')go('#/lab');else go('#/')});
$('#limBtn').addEventListener('click',()=>{SET.lim=!SET.lim;applySettings();
  try{if(SET.lim&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});if(!SET.lim&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
  toast(SET.lim?'Modalità LIM attiva':'Modalità LIM disattivata');route()});
window.addEventListener('hashchange',route);
applySettings();route();
})()}

</script>
</body>
</html>
